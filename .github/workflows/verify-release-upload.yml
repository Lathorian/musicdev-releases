name: Verify MusicDev release upload permissions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-release-upload.yml'

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the upload endpoint on a temporary draft
        shell: bash
        run: |
          set -euo pipefail
          repo=Lathorian/musicdev-releases
          tag="musicdev-upload-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          file="$RUNNER_TEMP/musicdev-update.json"
          expected=962d43141f3313694493a21f4dd4cca984f6036f04baaa24a0625516a0f1c216
          curl --fail --silent --show-error --location --max-time 30 \
            "https://github.com/$repo/releases/download/v0.8.3/musicdev-update.json" --output "$file"
          printf '%s  %s\n' "$expected" "$file" | sha256sum -c -
          gh release create "$tag" --repo "$repo" --draft --title "MusicDev upload check" --notes "Temporary release upload check."
          cleanup() {
            if [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft')" = true ]; then
              gh release delete "$tag" --repo "$repo" --yes
            fi
          }
          trap cleanup EXIT
          gh release upload "$tag" "$file" --repo "$repo"
          id=$(gh api "repos/$repo/releases" | jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft) | .id')
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api "repos/$repo/releases/$id/assets" \
            | jq -e --arg expected "sha256:$expected" 'length == 1 and .[0].state == "uploaded" and .[0].digest == $expected'
